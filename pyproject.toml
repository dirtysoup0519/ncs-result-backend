[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-result-backend"
version = "0.1.0"
description = "NCS analytics result database and backend foundation"
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]
mysql = [
    "PyMySQL>=1.1,<2",
]
prediction = [
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
